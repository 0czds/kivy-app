name: Robust Android APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # يتيح تشغيل البناء يدوياً بنقرة زر من جيتهاب

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Fix System Dependencies & Legacy Libraries (libtinfo5 / libncurses5)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixin-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-dev \
            python3-pip \
            libffi-dev \
            libssl-dev

          # حل جذري ومطلق لمشكلة libtinfo.so.5 و libncurses.so.5 المفقودة على Ubuntu 24.04
          sudo mkdir -p /lib/x86_64-linux-gnu /usr/lib/x86_64-linux-gnu
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 || true
          sudo ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5 || true
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true
          sudo ldconfig

      - name: 5. Install Pinned Python Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # تثبيت Cython بإصدار ثابت يمنع أخطاء التجميع مع python-for-android
          python -m pip install "cython==0.29.37"
          python -m pip install "buildozer==1.5.0"
          python -m pip install sh

      - name: 6. Cache Buildozer Dependencies (SDK / NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: 7. Prepare Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: 8. Build Android APK
        env:
          _JAVA_OPTIONS: "-Xmx4096m"
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
        run: |
          # القبول التلقائي لكافة الرخص والتجميع بنمط التفاصيل (verbose)
          yes | buildozer -v android debug

      - name: 9. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kivy-App-APK
          path: bin/*.apk
          if-no-files-found: error
